    { text: '抱住TA，说“我在呢”', type: 'Z' },
    { text: '心里很心疼，但嘴上说：哭什么，至于吗？', type: 'B' },
    { text: '不知道该说什么，但会一直陪着', type: 'W' }
  ]},
  { q: '你更认同哪句话？', options: [
    { text: '“朋友之间，尊重比亲密更重要。”', type: 'M' },
    { text: '“一段关系里，先认真的人先输。”', type: 'L' },
    { text: '“我放不下的不是TA，是当年的我自己。”', type: 'X' },
    { text: '“我要的从来不多，只是一个确定。”', type: 'W' }
  ]},
  { q: '如果一段友情让你一直内耗，你会——', options: [
    { text: '直接摊牌，说清楚，能处就处，不能处拉倒', type: 'Q' },
    { text: '慢慢淡出，不解释，不回头', type: 'L' },
    { text: '一边内耗一边继续，因为我舍不得', type: 'Z' },
    { text: '写很长的话，但最后可能一个字都不发出去', type: 'J' }
  ]},
  { q: '你最容易在哪种时刻“破防”？', options: [
    { text: '对方说“你对我来说是特别的”', type: 'W' },
    { text: '对方说“我一直都在”', type: 'Z' },
    { text: '对方说“我懂你”', type: 'Q' },
    { text: '对方什么都没说，但做了一件小事', type: 'M' }
  ]},
  { q: '别人觉得你“不好惹”，你觉得——', options: [
    { text: '对啊，所以别惹我', type: 'L' },
    { text: '我只是看起来凶，其实心软得要命', type: 'B' },
    { text: '我不在乎别人怎么觉得', type: 'M' },
    { text: '我不好惹，是因为我太容易被伤到', type: 'X' }
  ]},
  { q: '你如何看待“友情里的占有欲”？', options: [
    { text: '很正常。我在意的人，我希望我也是TA在意的', type: 'W' },
    { text: '我不太有。人来人往，正常', type: 'L' },
    { text: '我有，但我不会说。说了就输了', type: 'J' },
    { text: '我对朋友没什么占有欲，但TA要是背叛我，我会很彻底', type: 'M' }
  ]},
  { q: '你最像朋友眼中的哪种角色？', options: [
    { text: '那个看起来最凶、其实最护短的人', type: 'B' },
    { text: '那个最靠谱、情绪最稳的人', type: 'Q' },
    { text: '那个最会热场、最会主动的人', type: 'Z' },
    { text: '那个话最少、但心里什么都清楚的人', type: 'L' }
  ]},
  { q: '你对于“画地为牢”这个词的感受是——', options: [
    { text: '太懂了。我就是那个把自己关在里面的人', type: 'X' },
    { text: '我不会。我关了门就会把钥匙扔掉', type: 'L' },
    { text: '我关过，但后来我自己走出来了', type: 'Z' },
    { text: '我关的不是牢，是我给自己的安全区', type: 'M' }
  ]},
  { q: '如果测出你像某个人，你最希望别人说你像——', options: [
    { text: '“你像马天宇，体面，有边界。”', type: 'M' },
    { text: '“你像张萌，热烈，通透。”', type: 'Z' },
    { text: '“你像许飞，嘴硬，但心里全是柔软。”', type: 'X' },
    { text: '“你像厉娜，清醒，体面，不纠缠。”', type: 'L' }
  ]},
  { q: '最后一题：此刻，你心里有没有一个“后会友期”的人？', options: [
    { text: '有。但我可能不会告诉TA', type: 'X' },
    { text: '有。如果TA现在找我，我会回', type: 'Z' },
    { text: '有过，已经翻篇了', type: 'L' },
    { text: '我一直在等TA先开口', type: 'W' }
  ]}
];

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let scores = {};
let currentResult = null;

const $ = s => document.querySelector(s);
function show(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  $('#' + id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

function startQuiz(){
  answers.fill(null);
  current = 0;
  scores = { M: 0, Z: 0, X: 0, L: 0, B: 0, Q: 0, W: 0, J: 0 };
  renderQuestion();
  show('screen-quiz');
}

function renderQuestion(){
  const q = QUESTIONS[current];
  $('#qNum').textContent = 'Q' + (current + 1);
  $('#qTitle').textContent = q.q;
  $('#counter').textContent = (current + 1) + ' / ' + QUESTIONS.length;
  $('#progressIn').style.width = ((current + 1) / QUESTIONS.length * 100) + '%';
  $('#backBtn').disabled = current === 0;

  const box = $('#options');
  box.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[current] === idx ? ' sel' : '');
    btn.type = 'button';
    btn.textContent = opt.text;
    btn.onclick = () => pick(idx);
    box.appendChild(btn);
  });

  const card = box.parentElement;
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'fadeUp .35s ease both';
}

function pick(choice){
  const opts = document.querySelectorAll('.opt');
  if (opts[choice].classList.contains('sel')) return;
  answers[current] = choice;
  opts.forEach(o => o.classList.remove('sel'));
  opts[choice].classList.add('sel');
  setTimeout(() => {
    if (current < QUESTIONS.length - 1){ current++; renderQuestion(); }
    else { renderResult(); }
  }, 240);
}

function goBack(){ if (current === 0) return; current--; renderQuestion(); }

function calcResult(){
  scores = { M: 0, Z: 0, X: 0, L: 0, B: 0, Q: 0, W: 0, J: 0 };
  answers.forEach((ansIdx, qIdx) => {
    if (ansIdx !== null) {
      const type = QUESTIONS[qIdx].options[ansIdx].type;
      scores[type] = (scores[type] || 0) + 1;
    }
  });
  let best = 'M', max = -1;
  for (const key in scores) { if (scores[key] > max){ max = scores[key]; best = key; } }
  return best;
}

function renderResult(){
  const bestKey = calcResult();
  currentResult = bestKey;
  const t = TYPES[bestKey];
  $('#rEmoji').textContent = t.emoji;
  $('#rTag').textContent = t.tag;
  $('#rName').textContent = t.name;
  $('#rDesc').textContent = t.desc;
  $('#rQuote').innerHTML = t.quote;
  $('#rMatch').innerHTML = t.match;

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const maxScore = sorted[0][1] || 1;
  const barsEl = $('#rBars');
  barsEl.innerHTML = '';
  sorted.forEach(([k, v]) => {
    const pct = 12 + (v / maxScore) * 88;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<span class="bar-name">' + TYPES[k].name + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:0"></div></div>';
    barsEl.appendChild(row);
    requestAnimationFrame(() => {
      row.querySelector('.bar-fill').style.width = pct.toFixed(1) + '%';
    });
  });

  show('screen-result');
}

function copyShare(){
  if (!currentResult) return;
  const t = TYPES[currentResult];
  const text = '在《后会友期》旧友人格测试里，我最像「' + t.name + '」' + t.emoji + '——' + t.tag + '。\n你是旧友里的谁？来测测看吧。\n“终点未至，后会友期。”';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast('已复制，去粘贴吧')).catch(fallback);
  } else { fallback(); }
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制，去粘贴吧'); }
    catch (e) { toast('复制失败，请长按选择'); }
    document.body.removeChild(ta);
  }
}

$('#startBtn').addEventListener('click', startQuiz);
$('#backBtn').addEventListener('click', goBack);
$('#againBtn').addEventListener('click', startQuiz);
$('#copyBtn').addEventListener('click', copyShare);
</script>
</body>
